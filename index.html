<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRUTAL — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Butcherman&family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET E VARIÁVEIS ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0b0808;
      --bg-card: rgba(26,18,17,0.75);
      --border: rgba(61,42,38,0.5);
      --border-light: rgba(61,42,38,0.25);
      --blood: #a02020;
      --blood-bright: #d43f34;
      --blood-glow: rgba(212,63,52,0.25);
      --bone: #f0ede8;
      --bone-dim: #9a8c82;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.6);
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    html, body {
      height:100%;
      background: var(--bg);
      color: var(--bone);
      font-family: 'Inter', sans-serif;
      font-size:14px;
      line-height:1.6;
    }
    body {
      background-image: radial-gradient(ellipse at 20% 10%, rgba(160,32,32,0.12), transparent 50%),
                        radial-gradient(ellipse at 80% 90%, rgba(136,192,91,0.05), transparent 40%);
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
    input, select { font:inherit; color:inherit; background:transparent; border:none; outline:none; }

    /* ===== TIPOGRAFIA ===== */
    h1,h2,h3,h4 { font-family:'Anton',sans-serif; font-weight:400; letter-spacing:0.06em; text-transform:uppercase; }
    .logo {
      font-family:'Butcherman',cursive;
      font-size:28px;
      background:linear-gradient(135deg, var(--blood-bright), var(--blood));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 16px var(--blood-glow));
      line-height:1;
    }
    .logo small { display:block; font-family:'Inter',sans-serif; font-size:9px; letter-spacing:0.2em; color:var(--bone-dim); -webkit-text-fill-color:var(--bone-dim); text-transform:uppercase; margin-top:-2px; }

    /* ===== HEADER ===== */
    header {
      position:sticky; top:0; z-index:100;
      background:rgba(11,8,8,0.88); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      padding:10px 28px;
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    }
    .header-left { display:flex; align-items:center; gap:20px; }
    .header-right { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

    /* ===== BUTTONS ===== */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:10px 20px; border-radius:10px; font-weight:600; font-size:12px;
      letter-spacing:0.06em; text-transform:uppercase;
      border:1px solid var(--border);
      background:rgba(26,18,17,0.6);
      color:var(--bone);
      transition:var(--transition);
      cursor:pointer;
    }
    .btn:hover { background:var(--blood); border-color:var(--blood-bright); transform:translateY(-2px); box-shadow:0 8px 24px var(--blood-glow); }
    .btn.ghost { background:transparent; border-color:var(--border-light); }
    .btn.ghost:hover { background:rgba(212,63,52,0.12); border-color:var(--blood-bright); transform:none; box-shadow:none; }
    .btn.sick { background:rgba(136,192,91,0.12); border-color:#88c05b; color:#88c05b; }
    .btn.sick:hover { background:#88c05b; color:#0b0808; border-color:#88c05b; box-shadow:0 8px 24px rgba(136,192,91,0.2); }
    .btn.small { padding:6px 14px; font-size:10px; border-radius:6px; }

    /* ===== CARDS ===== */
    .card {
      background:var(--bg-card);
      backdrop-filter:blur(8px);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:24px;
      box-shadow:var(--shadow);
      transition:border-color var(--transition), transform var(--transition);
    }
    .card:hover { border-color:rgba(212,63,52,0.3); }
    .card-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border-light);
    }
    .card-header h4 { font-size:16px; color:var(--bone); letter-spacing:0.08em; }
    .card-header .badge { font-size:10px; color:var(--bone-dim); background:rgba(0,0,0,0.3); padding:4px 12px; border-radius:20px; border:1px solid var(--border-light); }

    /* ===== FORMS ===== */
    .field { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
    .field label { font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--bone-dim); }
    .field input, .field select {
      background:rgba(0,0,0,0.3);
      border:1px solid var(--border-light);
      padding:10px 14px;
      border-radius:8px;
      font-size:13px;
      color:var(--bone);
      transition:border-color var(--transition), box-shadow var(--transition);
    }
    .field input:focus, .field select:focus { border-color:var(--blood-bright); box-shadow:0 0 0 3px var(--blood-glow); }
    .field select option { background:var(--bg); color:var(--bone); }
    .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
    .row .field { flex:1; min-width:140px; }

    /* ===== AUTH ===== */
    .auth-card {
      max-width:420px; margin:40px auto;
      background:var(--bg-card); backdrop-filter:blur(12px);
      border:1px solid var(--border); border-radius:var(--radius);
      padding:32px; box-shadow:var(--shadow);
    }
    .auth-logo { text-align:center; margin-bottom:24px; }
    .auth-logo .logo { font-size:38px; }
    .auth-tabs { display:flex; gap:8px; margin-bottom:24px; }
    .auth-tabs button {
      flex:1; padding:10px; border-radius:8px; font-weight:600; font-size:12px;
      text-transform:uppercase; letter-spacing:0.06em;
      background:rgba(0,0,0,0.3); border:1px solid var(--border-light);
      color:var(--bone-dim); transition:var(--transition);
    }
    .auth-tabs button.active { background:var(--blood); border-color:var(--blood-bright); color:var(--bone); box-shadow:0 0 20px var(--blood-glow); }
    .auth-tabs button:hover { color:var(--bone); }
    .auth-form { display:none; }
    .auth-form.active { display:block; animation:fadeUp 0.3s ease; }
    .auth-form .btn { width:100%; margin-top:8px; }

    /* ===== LOBBY ===== */
    .lobby-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:20px; }
    @media (max-width:700px) { .lobby-grid { grid-template-columns:1fr; } }

    /* ===== MISC ===== */
    .meta { font-size:12px; color:var(--bone-dim); line-height:1.5; }
    .toast-container {
      position:fixed; top:20px; right:20px; z-index:500;
      display:flex; flex-direction:column; gap:8px; pointer-events:none;
      max-width:360px; width:100%;
    }
    .toast {
      pointer-events:auto;
      background:var(--bg-card); backdrop-filter:blur(12px);
      border:1px solid var(--border); border-left:4px solid var(--blood-bright);
      padding:14px 18px; border-radius:12px; font-size:13px; color:var(--bone);
      box-shadow:var(--shadow);
      animation:toastIn 0.3s ease;
    }
    .toast.sucesso { border-left-color:#88c05b; }
    .toast.erro { border-left-color:var(--blood-bright); }
    .toast.info { border-left-color:#c9833a; }
    .toast.saindo { animation:toastOut 0.2s ease forwards; }
    @keyframes toastIn { from { opacity:0; transform:translateX(20px) scale(0.95); } to { opacity:1; transform:translateX(0) scale(1); } }
    @keyframes toastOut { to { opacity:0; transform:translateX(20px) scale(0.95); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== RESPONSIVE ===== */
    @media (max-width:600px) {
      header { padding:8px 16px; }
      .logo { font-size:22px; }
      .auth-card { padding:20px; margin:20px 12px; }
      .card { padding:16px; }
      .row { flex-direction:column; align-items:stretch; }
      .row .field { min-width:unset; }
    }
    /* ===== FUNDO DO SITE ===== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url('img/fundo.png');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  opacity: 0.18;
  z-index: 0;
  pointer-events: none;
}
body > * {
  position: relative;
  z-index: 1;
}

/* ===== SCROLLBAR CUSTOMIZADA ===== */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.35); border-radius: 10px; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--blood), var(--blood-bright));
  border-radius: 10px;
  border: 2px solid rgba(11, 8, 8, 0.9);
  background-clip: padding-box;
  transition: background 0.2s;
}
::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, var(--blood-bright), #ff5a3c);
  background-clip: padding-box;
}
::-webkit-scrollbar-corner { background: transparent; }
* { scrollbar-width: thin; scrollbar-color: var(--blood) rgba(0, 0, 0, 0.35); }

/* ===== SELECT CUSTOMIZADO ===== */
.field select,
select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-color: rgba(0, 0, 0, 0.4);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%23d43f34' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 12px;
  border: 1px solid var(--border-light);
  border-radius: 8px;
  padding: 10px 38px 10px 14px;
  color: var(--bone);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: all var(--transition);
  text-overflow: ellipsis;
}
.field select:hover,
select:hover {
  border-color: var(--blood);
  background-color: rgba(0, 0, 0, 0.5);
}
.field select:focus,
select:focus {
  border-color: var(--blood-bright);
  box-shadow: 0 0 0 3px var(--blood-glow);
  outline: none;
}
.field select option,
select option {
  background: #1a1211;
  color: var(--bone);
  padding: 10px;
  font-weight: 500;
}

/* ===== INPUTS COM HOVER ===== */
.field input {
  background-color: rgba(0, 0, 0, 0.4);
  transition: all var(--transition);
}
.field input:hover {
  border-color: var(--blood);
  background-color: rgba(0, 0, 0, 0.5);
}
  </style>
</head>
<body>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <div class="logo">BRUTAL<small>thriller de mesa</small></div>
    </div>
    <div class="header-right">
      <button class="btn ghost small" id="btn-logout" style="display:none;" onclick="fazerLogout()">Sair</button>
    </div>
  </header>

  <!-- MAIN -->
  <main style="flex:1; max-width:1280px; margin:0 auto; padding:24px 20px 60px; width:100%;">

    <!-- ===== AUTH ===== -->
    <section id="tela-auth" class="active">
      <div class="auth-card">
        <div class="auth-logo"><div class="logo">BRUTAL<small>thriller de mesa</small></div></div>
        <div class="auth-tabs">
          <button class="active" data-auth="login" onclick="mudarAbaAuth('login')">Entrar</button>
          <button data-auth="cadastro" onclick="mudarAbaAuth('cadastro')">Criar conta</button>
        </div>
        <div id="auth-form-login" class="auth-form active">
          <div class="field"><label>Usuário</label><input id="login-usuario" placeholder="ex: duda_sobrevivente" autocomplete="username" /></div>
          <div class="field"><label>Senha</label><input id="login-senha" type="password" placeholder="••••••" autocomplete="current-password" /></div>
          <button class="btn" onclick="fazerLogin()">Entrar</button>
        </div>
        <div id="auth-form-cadastro" class="auth-form">
          <div class="field"><label>Usuário</label><input id="cad-usuario" placeholder="ex: duda_sobrevivente" autocomplete="username" /></div>
          <div class="field"><label>Senha (mínimo 6 caracteres)</label><input id="cad-senha" type="password" placeholder="••••••" autocomplete="new-password" /></div>
          <button class="btn sick" onclick="fazerCadastro()">Criar conta</button>
        </div>
        <p class="meta" style="text-align:center;margin-top:16px;">Sua conta guarda suas fichas e campanhas no banco de dados.</p>
      </div>
    </section>

    <!-- ===== LOBBY ===== -->
    <section id="tela-lobby" style="display:none;">
      <div class="card" style="margin-bottom:24px;">
        <h1 style="font-family:'Anton',sans-serif; font-size:clamp(28px,5vw,44px); color:var(--blood-bright);">
          Bem-vinda, <span id="lobby-nome"></span>
        </h1>
        <p class="meta">Crie uma mesa nova (você vira a Diretora) ou entre com o código de uma sala já existente.</p>
      </div>
      <div class="lobby-grid">
        <div class="card">
          <div class="card-header"><h4>Criar campanha</h4><span class="badge">Diretora</span></div>
          <div class="field"><label>Nome da campanha</label><input id="c-nome" placeholder="ex: Acampamento Lago Negro" /></div>
          <button class="btn" onclick="criarCampanha()">Criar sala</button>
        </div>
        <div class="card">
          <div class="card-header"><h4>Entrar como Intérprete</h4><span class="badge">Jogadora</span></div>
          <div class="field"><label>Código da sala</label><input id="c-codigo" placeholder="ex: LAGO-NEGRO-42" /></div>
          <button class="btn ghost" onclick="entrarCampanha()">Entrar</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Firebase (ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import {
      getFirestore, doc, setDoc, getDoc, updateDoc,
      collection, addDoc, getDocs, onSnapshot,
      query, orderBy, limitToLast, enableIndexedDbPersistence
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      onAuthStateChanged, signOut, updateProfile
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Hnv0ZsZxa3SHKuOdMvYdcU0MPg65umY",
      authDomain: "brutal-52013.firebaseapp.com",
      projectId: "brutal-52013",
      storageBucket: "brutal-52013.firebasestorage.app",
      messagingSenderId: "20777925820",
      appId: "1:20777925820:web:497504355d0ca9da83a4b9"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    enableIndexedDbPersistence(db).catch(()=>{});

    // Disponibilizar funções no escopo global (para onclick)
    window.db = db;
    window.auth = auth;
    window.fsDoc = doc;
    window.fsSetDoc = setDoc;
    window.fsGetDoc = getDoc;
    window.fsUpdateDoc = updateDoc;
    window.fsCollection = collection;
    window.fsAddDoc = addDoc;
    window.fsGetDocs = getDocs;
    window.fsOnSnapshot = onSnapshot;
    window.fsQuery = query;
    window.fsOrderBy = orderBy;
    window.fsLimitToLast = limitToLast;
    window.fsCreateUser = createUserWithEmailAndPassword;
    window.fsSignIn = signInWithEmailAndPassword;
    window.fsSignOut = signOut;
    window.fsUpdateProfile = updateProfile;
    window.fsOnAuthStateChanged = onAuthStateChanged;
    window.dispatchEvent(new Event('firebase-pronto'));

    // ===== UTILITÁRIOS =====
    window.escapeHtml = (str) => String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    window.toast = (msg, tipo='info') => {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast ${tipo}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => { el.classList.add('saindo'); setTimeout(() => el.remove(), 220); }, 4200);
    };
    window.mostrarTela = (id) => {
      document.querySelectorAll('main > section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    };

    // ===== AUTENTICAÇÃO =====
    let perfilAtual = null;
    let campanhaAtiva = null;

    function usernameParaEmail(usuario) {
      const limpo = usuario.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'');
      return `${limpo}@brutal.local`;
    }

    window.mudarAbaAuth = (qual) => {
      document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.toggle('active', b.dataset.auth === qual));
      document.getElementById('auth-form-login').classList.toggle('active', qual === 'login');
      document.getElementById('auth-form-cadastro').classList.toggle('active', qual === 'cadastro');
    };

    window.fazerCadastro = async () => {
      const usuario = document.getElementById('cad-usuario').value.trim();
      const senha = document.getElementById('cad-senha').value;
      if (!usuario || usuario.length < 3) { toast('Usuário precisa ter pelo menos 3 letras.', 'erro'); return; }
      if (!senha || senha.length < 6) { toast('Senha precisa ter pelo menos 6 caracteres.', 'erro'); return; }
      try {
        const cred = await window.fsCreateUser(window.auth, usernameParaEmail(usuario), senha);
        await window.fsUpdateProfile(cred.user, { displayName: usuario });
        await window.fsSetDoc(window.fsDoc(window.db, 'usuarios', cred.user.uid), { nomeUsuario: usuario, campanhaAtiva: null });
        toast(`Conta criada. Bem-vinda, ${usuario}!`, 'sucesso');
      } catch (e) {
        console.error(e);
        if (e.code === 'auth/email-already-in-use') toast('Esse nome de usuário já existe.', 'erro');
        else if (e.code === 'auth/weak-password') toast('Senha muito fraca.', 'erro');
        else toast('Erro ao criar conta.', 'erro');
      }
    };

    window.fazerLogin = async () => {
      const usuario = document.getElementById('login-usuario').value.trim();
      const senha = document.getElementById('login-senha').value;
      if (!usuario || !senha) { toast('Preencha usuário e senha.', 'erro'); return; }
      try {
        await window.fsSignIn(window.auth, usernameParaEmail(usuario), senha);
      } catch (e) {
        console.error(e);
        toast('Usuário ou senha incorretos.', 'erro');
      }
    };

    window.fazerLogout = async () => {
      await window.fsSignOut(window.auth);
      window.location.reload();
    };

    // ===== CAMPANHAS =====
    function gerarCodigo(nome) {
      return nome.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Math.floor(Math.random()*90+10);
    }

    window.criarCampanha = async () => {
      if (!perfilAtual) return;
      const nome = document.getElementById('c-nome').value.trim();
      if (!nome) { toast('Dê um nome pra campanha.', 'erro'); return; }
      const codigo = gerarCodigo(nome);
      const membro = { uid: perfilAtual.uid, nomeUsuario: perfilAtual.nomeUsuario, papel: 'diretora' };
      try {
        await window.fsSetDoc(window.fsDoc(window.db, 'campanhas', codigo), {
          nome, diretoraUid: perfilAtual.uid, membros: [membro], membrosUids: [perfilAtual.uid],
          iniciativa: { indice: 0 }, descarte: { valor: 0 }, rolando: null, criadaEm: Date.now()
        });
        await window.fsSetDoc(window.fsDoc(window.db, 'usuarios', perfilAtual.uid), { nomeUsuario: perfilAtual.nomeUsuario, campanhaAtiva: codigo }, { merge: true });
        toast(`Sala "${nome}" criada. Código: ${codigo}`, 'sucesso');
        // Redirecionar para a página do mestre
        window.location.href = `mestre.html?campanha=${codigo}`;
      } catch (e) { console.error(e); toast('Erro ao criar sala.', 'erro'); }
    };

    window.entrarCampanha = async () => {
      if (!perfilAtual) return;
      const codigo = document.getElementById('c-codigo').value.trim().toUpperCase();
      if (!codigo) { toast('Preencha o código.', 'erro'); return; }
      try {
        const ref = window.fsDoc(window.db, 'campanhas', codigo);
        const snap = await window.fsGetDoc(ref);
        if (!snap.exists()) { toast('Campanha não encontrada.', 'erro'); return; }
        const info = snap.data();
        if (!info.membrosUids.includes(perfilAtual.uid)) {
          const membros = [...info.membros, { uid: perfilAtual.uid, nomeUsuario: perfilAtual.nomeUsuario, papel: 'jogador' }];
          const membrosUids = [...info.membrosUids, perfilAtual.uid];
          await window.fsUpdateDoc(ref, { membros, membrosUids });
        }
        await window.fsSetDoc(window.fsDoc(window.db, 'usuarios', perfilAtual.uid), { nomeUsuario: perfilAtual.nomeUsuario, campanhaAtiva: codigo }, { merge: true });
        toast(`Entrou em "${info.nome}".`, 'sucesso');
        // Redirecionar para a página do jogador
        window.location.href = `jogador.html?campanha=${codigo}`;
      } catch (e) { console.error(e); toast('Erro ao entrar.', 'erro'); }
    };

    // ===== ESTADO DE AUTENTICAÇÃO =====
    window.fsOnAuthStateChanged(window.auth, async (user) => {
      if (!user) {
        perfilAtual = null;
        document.getElementById('btn-logout').style.display = 'none';
        document.getElementById('tela-auth').classList.add('active');
        document.getElementById('tela-lobby').style.display = 'none';
        return;
      }
      let dadosUsuario;
      try {
        const snap = await window.fsGetDoc(window.fsDoc(window.db, 'usuarios', user.uid));
        dadosUsuario = snap.exists() ? snap.data() : { nomeUsuario: user.displayName || 'Sobrevivente', campanhaAtiva: null };
      } catch (e) {
        console.error(e);
        dadosUsuario = { nomeUsuario: user.displayName || 'Sobrevivente', campanhaAtiva: null };
      }
      perfilAtual = { uid: user.uid, nomeUsuario: dadosUsuario.nomeUsuario };
      document.getElementById('btn-logout').style.display = 'inline-block';
      document.getElementById('lobby-nome').textContent = perfilAtual.nomeUsuario;
      document.getElementById('tela-auth').classList.remove('active');
      document.getElementById('tela-auth').style.display = 'none';
      document.getElementById('tela-lobby').style.display = 'block';
      document.getElementById('tela-lobby').classList.add('active');

      // Se já estiver em uma campanha, redirecionar automaticamente
      if (dadosUsuario.campanhaAtiva) {
        // Buscar a campanha para saber o papel
        const snapCamp = await window.fsGetDoc(window.fsDoc(window.db, 'campanhas', dadosUsuario.campanhaAtiva));
        if (snapCamp.exists()) {
          const info = snapCamp.data();
          const papel = info.diretoraUid === perfilAtual.uid ? 'mestre' : 'jogador';
          window.location.href = `${papel}.html?campanha=${dadosUsuario.campanhaAtiva}`;
        } else {
          // Campanha não existe mais
          await window.fsSetDoc(window.fsDoc(window.db, 'usuarios', perfilAtual.uid), { campanhaAtiva: null }, { merge: true });
        }
      }
    });
  </script>
</body>
</html>
