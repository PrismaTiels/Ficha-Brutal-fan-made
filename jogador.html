<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRUTAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Butcherman&family=Anton&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0b0808; --bg-card:rgba(26,18,17,0.75);
      --border:rgba(61,42,38,0.5); --border-light:rgba(61,42,38,0.25);
      --blood:#a02020; --blood-bright:#d43f34; --blood-glow:rgba(212,63,52,0.25);
      --bone:#f0ede8; --bone-dim:#9a8c82;
      --sick:#88c05b; --sick-glow:rgba(136,192,91,0.25);
      --sky:#38bdf8; --sky-glow:rgba(56,189,248,0.25);
      --amber:#c9833a; --amber-glow:rgba(201,131,58,0.2);
      --radius:16px; --shadow:0 8px 32px rgba(0,0,0,0.6);
      --transition:0.25s cubic-bezier(0.4,0,0.2,1);
    }
    html, body { height:100%; background:var(--bg); color:var(--bone); font-family:'Inter',sans-serif; font-size:14px; line-height:1.6; }
    body {
      background-image: radial-gradient(ellipse at 20% 10%, rgba(160,32,32,0.12), transparent 50%),
                        radial-gradient(ellipse at 80% 90%, rgba(136,192,91,0.05), transparent 40%);
      display:flex; flex-direction:column; min-height:100vh;
    }
    button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
    input, select { font:inherit; color:inherit; background:transparent; border:none; outline:none; }

    .logo { font-family:'Butcherman',cursive; font-size:28px;
      background:linear-gradient(135deg, var(--blood-bright), var(--blood));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 16px var(--blood-glow)); line-height:1; }
    .logo small { display:block; font-family:'Inter',sans-serif; font-size:9px; letter-spacing:0.2em;
      color:var(--bone-dim); -webkit-text-fill-color:var(--bone-dim); text-transform:uppercase; margin-top:-2px; }

    header { position:sticky; top:0; z-index:100; background:rgba(11,8,8,0.88); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border); padding:10px 28px;
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .header-left { display:flex; align-items:center; gap:20px; }
    .header-right { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    nav { display:flex; gap:4px; }
    nav button { padding:8px 16px; border-radius:8px; font-size:11px; font-weight:600;
      letter-spacing:0.08em; text-transform:uppercase; color:var(--bone-dim);
      border:1px solid transparent; transition:var(--transition); }
    nav button.active { color:var(--bone); background:var(--blood); border-color:var(--blood-bright); box-shadow:0 0 20px var(--blood-glow); }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:10px 20px; border-radius:10px; font-weight:600; font-size:12px;
      letter-spacing:0.06em; text-transform:uppercase; border:1px solid var(--border);
      background:rgba(26,18,17,0.6); color:var(--bone); transition:var(--transition); cursor:pointer; }
    .btn:hover { background:var(--blood); border-color:var(--blood-bright); transform:translateY(-2px); box-shadow:0 8px 24px var(--blood-glow); }
    .btn.ghost { background:transparent; border-color:var(--border-light); }
    .btn.ghost:hover { background:rgba(212,63,52,0.12); border-color:var(--blood-bright); transform:none; box-shadow:none; }
    .btn.small { padding:6px 14px; font-size:10px; border-radius:6px; }
    .btn:disabled { opacity:0.35; pointer-events:none; transform:none !important; }

    .card { background:var(--bg-card); backdrop-filter:blur(8px); border:1px solid var(--border);
      border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);
      transition:border-color var(--transition); margin-bottom:20px; }
    .card-header { display:flex; align-items:center; justify-content:space-between;
      margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border-light); }
    .card-header h4 { font-size:16px; color:var(--bone); letter-spacing:0.08em; }
    .card-header .badge { font-size:10px; color:var(--bone-dim); background:rgba(0,0,0,0.3);
      padding:4px 12px; border-radius:20px; border:1px solid var(--border-light); }

    .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
    .field { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; flex:1; min-width:140px; }
    .field label { font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--bone-dim); }
    .field input, .field select { background:rgba(0,0,0,0.3); border:1px solid var(--border-light);
      padding:10px 14px; border-radius:8px; font-size:13px; color:var(--bone);
      transition:border-color var(--transition), box-shadow var(--transition); }
    .field input:focus, .field select:focus { border-color:var(--blood-bright); box-shadow:0 0 0 3px var(--blood-glow); }
    .field select option { background:var(--bg); color:var(--bone); }

    .pill { display:inline-block; background:rgba(0,0,0,0.3); border:1px solid var(--border-light);
      padding:4px 12px; border-radius:20px; font-size:10px; font-weight:600; letter-spacing:0.04em;
      color:var(--bone-dim); margin:2px 4px 2px 0; }
    .pill.active { border-color:var(--blood-bright); color:var(--bone); }
    .meta { font-size:12px; color:var(--bone-dim); line-height:1.5; }
    .empty { color:var(--bone-dim); padding:20px; text-align:center; border:1px dashed var(--border-light);
      border-radius:8px; font-size:13px; }
    .note { background:var(--amber-glow); border-left:4px solid var(--amber); padding:12px 16px;
      border-radius:0 8px 8px 0; font-size:13px; color:var(--bone); }

    .dots { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:6px 0; }
    .dot { width:28px; height:28px; border-radius:6px; border:2px solid var(--border-light);
      cursor:pointer; transition:var(--transition); background:rgba(0,0,0,0.2); }
    .dot.ferida.on { background:var(--blood-bright); border-color:var(--blood-bright); box-shadow:0 0 16px var(--blood-glow); }
    .dot.sequela.on { background:var(--amber); border-color:var(--amber); box-shadow:0 0 16px var(--amber-glow); }
    .dot:hover { border-color:var(--bone-dim); transform:scale(1.1); }

    .initiative { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .init-step { padding:8px 16px; border-radius:20px; background:rgba(0,0,0,0.3);
      border:1px solid var(--border-light); font-size:12px; font-weight:600;
      text-transform:uppercase; color:var(--bone-dim); }
    .init-step.current { border-color:var(--sick); color:var(--sick); background:var(--sick-glow); }
    .init-step.assassino { border-color:var(--blood-bright); color:var(--blood-bright); }
    .init-step.assassino.current { background:var(--blood-glow); }

    .ability { background:rgba(0,0,0,0.2); border:1px solid var(--border-light);
      border-radius:10px; padding:12px 16px; margin-bottom:8px;
      display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .ability .txt b { color:var(--bone); font-size:13px; }
    .ability .txt p { margin:4px 0 0; font-size:12px; color:var(--bone-dim); line-height:1.5; }
    .ability label { font-size:10px; display:flex; align-items:center; gap:6px;
      white-space:nowrap; color:var(--bone-dim); cursor:pointer; }

    .recurso-chip { display:flex; align-items:center; justify-content:space-between;
      background:rgba(0,0,0,0.2); border:1px solid var(--border-light);
      border-radius:8px; padding:8px 12px; margin-bottom:6px; font-size:13px; }

    .marcadores-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:12px; }
    .marcador-item { display:flex; flex-direction:column; align-items:center; gap:6px;
      padding:10px 6px; background:rgba(0,0,0,0.2);
      border:1px solid var(--border-light); border-radius:12px; }
    .marcador-nome { font-size:10px; font-weight:700; text-transform:uppercase;
      letter-spacing:0.06em; color:var(--bone-dim); text-align:center;
      max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .marcador-controles { display:flex; gap:4px; align-items:center; }
    .marcador-btn { width:22px; height:22px; border-radius:5px;
      background:rgba(0,0,0,0.4); border:1px solid var(--border-light);
      color:var(--bone-dim); font-size:12px; font-weight:700; line-height:1;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:var(--transition); }
    .marcador-btn:hover { border-color:var(--blood-bright); color:var(--blood-bright); }
    .marcador-btn.del:hover { background:rgba(239,68,68,0.15); border-color:#ef4444; color:#ef4444; }

    .log-entry { font-size:12px; color:var(--bone-dim); border-bottom:1px solid var(--border-light); padding:6px 0; }
    .log-entry b { color:var(--bone); }

    .btn-arriscar-card { width:100%; background:linear-gradient(135deg, var(--blood-bright), var(--blood));
      color:#fff; border:none; padding:14px; border-radius:12px; font-weight:700;
      font-size:14px; letter-spacing:0.1em; text-transform:uppercase;
      box-shadow:0 4px 20px var(--blood-glow); transition:var(--transition); margin:8px 0; }
    .btn-arriscar-card:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 32px var(--blood-glow); }
    .btn-arriscar-card:disabled { opacity:0.4; cursor:not-allowed; }

    .toast-container { position:fixed; top:20px; right:20px; z-index:500;
      display:flex; flex-direction:column; gap:8px; pointer-events:none; max-width:360px; width:100%; }
    .toast { pointer-events:auto; background:var(--bg-card); backdrop-filter:blur(12px);
      border:1px solid var(--border); border-left:4px solid var(--blood-bright);
      padding:14px 18px; border-radius:12px; font-size:13px; color:var(--bone);
      box-shadow:var(--shadow); animation:toastIn 0.3s ease; }
    .toast.sucesso { border-left-color:var(--sick); }
    .toast.erro { border-left-color:var(--blood-bright); }
    .toast.info { border-left-color:var(--amber); }
    .toast.saindo { animation:toastOut 0.2s ease forwards; }
    @keyframes toastIn { from { opacity:0; transform:translateX(20px) scale(0.95); } to { opacity:1; transform:translateX(0) scale(1); } }
    @keyframes toastOut { to { opacity:0; transform:translateX(20px) scale(0.95); } }

    .ficha-grid { display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:20px; margin-top:20px; align-items:start; }
    @media (max-width:1100px) { .ficha-grid { grid-template-columns:1fr 1fr; }
      .ficha-grid .col-right { grid-column:span 2; display:grid; grid-template-columns:1fr 1fr; gap:20px; } }
    @media (max-width:700px) { .ficha-grid { grid-template-columns:1fr; }
      .ficha-grid .col-right { grid-column:span 1; grid-template-columns:1fr; } }

    .ficha-topo { display:grid; grid-template-columns:80px 1fr; gap:20px; align-items:center;
      background:var(--bg-card); backdrop-filter:blur(8px); border:1px solid var(--border);
      border-radius:var(--radius); padding:20px 24px; box-shadow:var(--shadow); margin-bottom:20px; }
    .ficha-avatar { width:80px; height:80px; border-radius:50%;
      background:radial-gradient(circle at 30% 30%, var(--blood-bright), var(--blood));
      display:flex; align-items:center; justify-content:center;
      font-family:'Anton',sans-serif; font-size:32px; color:#fff;
      border:2px solid var(--blood-bright); box-shadow:0 0 30px var(--blood-glow); flex-shrink:0; }
    .ficha-avatar-img { width:80px; height:80px; border-radius:50%; object-fit:cover;
      border:2px solid var(--blood-bright); box-shadow:0 0 30px var(--blood-glow);
      flex-shrink:0; display:block; }

    .abas-ficha { display:flex; gap:4px; border-bottom:2px solid var(--border-light); margin-bottom:20px; flex-wrap:wrap; }
    .aba-ficha { padding:8px 4px 12px; font-weight:600; font-size:12px; letter-spacing:0.06em;
      text-transform:uppercase; color:var(--bone-dim); border-bottom:2px solid transparent;
      transition:var(--transition); cursor:pointer; margin-right:16px; position:relative; }
    .aba-ficha::after { content:''; position:absolute; bottom:-2px; left:0; width:100%;
      height:2px; background:var(--blood-bright); transform:scaleX(0); transition:transform var(--transition); }
    .aba-ficha.active { color:var(--bone); }
    .aba-ficha.active::after { transform:scaleX(1); }
    .conteudo-aba { display:none; animation:fadeUp 0.25s ease; }
    .conteudo-aba.active { display:block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .dado { position:relative; width:52px; height:52px;
      display:flex; align-items:center; justify-content:center;
      cursor:grab; user-select:none; flex-shrink:0;
      transition:transform 0.15s; }
    .dado:hover { transform:translateY(-3px) scale(1.06); }
    .dado:active { cursor:grabbing; }
    .dado img { position:absolute; inset:0; width:100%; height:100%;
      object-fit:contain; z-index:0; pointer-events:none;
      filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
    .dado::after {
      content:''; position:absolute; inset:0; border-radius:6px;
      background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.35) 100%);
      box-shadow: inset 0 0 8px 1px rgba(0,0,0,0.25);
      pointer-events:none; z-index:1; }
    .dado .valor { position:relative; z-index:2;
      font-family:'Anton',sans-serif; font-size:22px; color:#fff; line-height:1;
      text-shadow:0 2px 4px #000, 0 0 8px #000, 1px 1px 0 #000, -1px -1px 0 #000; }
    .dado.success .valor { color:var(--sick); text-shadow:0 0 10px var(--sick-glow), 0 2px 4px #000, 0 0 4px #000; }
    .dado.fail .valor { color:var(--blood-bright); text-shadow:0 0 10px var(--blood-glow), 0 2px 4px #000, 0 0 4px #000; }
    .dado.success img { filter:drop-shadow(0 0 10px var(--sick-glow)) drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
    .dado.fail img { filter:drop-shadow(0 0 10px var(--blood-glow)) drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
    @keyframes dadoRolando { 0% { transform:rotate(-8deg) scale(0.9); } 50% { transform:rotate(8deg) scale(1.1); } 100% { transform:rotate(-8deg) scale(0.9); } }
    .dado.rolling { animation:dadoRolando 0.4s ease-in-out infinite alternate; }

    .dice-area { display:grid; grid-template-columns:1fr auto; gap:16px; margin-bottom:16px; }
    @media (max-width:600px) { .dice-area { grid-template-columns:1fr; } }

    .mesa { position:relative;
      background:linear-gradient(135deg, rgba(139,0,0,0.15) 0%, rgba(0,0,0,0.4) 100%);
      border:2px solid var(--blood); border-radius:var(--radius);
      padding:24px 16px 16px; min-height:150px;
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; align-content:flex-start;
      box-shadow:inset 0 0 40px rgba(139,0,0,0.15);
      transition:var(--transition); }
    .mesa.drag-over { border-color:var(--blood-bright);
      box-shadow:inset 0 0 40px rgba(212,63,52,0.3), 0 0 30px var(--blood-glow); }
    .mesa-titulo { position:absolute; top:-10px; left:16px;
      background:var(--bg); padding:0 10px;
      font-family:'Anton',sans-serif; font-size:11px; letter-spacing:0.15em;
      color:var(--blood-bright); text-transform:uppercase; }
    .mesa-vazia { color:var(--bone-dim); font-size:12px; letter-spacing:0.08em;
      text-transform:uppercase; opacity:0.5; user-select:none; }

    .acoes-dados { display:flex; flex-direction:column; gap:8px; min-width:150px; }
    .btn-acao-dado { padding:14px 16px; border-radius:10px;
      font-family:'Anton',sans-serif; font-size:12px; letter-spacing:0.12em;
      text-transform:uppercase; background:rgba(0,0,0,0.4);
      border:1px solid var(--border); color:var(--bone-dim);
      cursor:pointer; transition:var(--transition);
      display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-acao-dado:hover:not(:disabled) { background:rgba(212,63,52,0.15);
      border-color:var(--blood-bright); color:var(--bone); }
    .btn-acao-dado.rolar { background:linear-gradient(135deg, var(--blood-bright), var(--blood));
      border-color:var(--blood-bright); color:#fff; box-shadow:0 4px 20px var(--blood-glow); }
    .btn-acao-dado.rolar:hover:not(:disabled) { transform:translateY(-2px);
      box-shadow:0 8px 32px var(--blood-glow); filter:brightness(1.1); }
    .btn-acao-dado:disabled { opacity:0.3; cursor:not-allowed; }

    .zonas-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:700px) { .zonas-grid { grid-template-columns:1fr; } }

    .zona { background:rgba(0,0,0,0.25); border:2px dashed var(--border-light);
      border-radius:var(--radius); padding:14px; min-height:160px;
      display:flex; flex-direction:column;
      transition:border-color var(--transition), background var(--transition); }
    .zona.drag-over { background:rgba(212,63,52,0.1); transform:scale(1.01); }
    .zona.comum { border-color:rgba(136,192,91,0.35); }
    .zona.comum.drag-over { border-color:var(--sick); background:var(--sick-glow); }
    .zona.comum.cheio { border-color:rgba(136,192,91,0.15); }
    .zona.fuga { border-color:rgba(56,189,248,0.35); }
    .zona.fuga.drag-over { border-color:var(--sky); background:var(--sky-glow); }
    .zona.fuga.cheio { border-color:rgba(56,189,248,0.15); }

    .zona-titulo { font-family:'Anton',sans-serif; font-size:11px; letter-spacing:0.15em;
      text-transform:uppercase; margin-bottom:10px;
      display:flex; justify-content:space-between; align-items:center; }
    .zona.comum .zona-titulo { color:var(--sick); }
    .zona.fuga .zona-titulo { color:var(--sky); }
    .zona-count { font-family:'JetBrains Mono',monospace; font-size:10px;
      color:var(--bone-dim); background:rgba(0,0,0,0.4);
      padding:1px 8px; border-radius:10px; }
    .zona-count.cheio { color:var(--blood-bright); background:rgba(212,63,52,0.15); }

    .zona-body { flex:1; display:flex; flex-wrap:wrap; gap:6px;
      align-content:flex-start; align-items:flex-start; }

    .add-die-btn { width:44px; height:44px; border:2px dashed var(--border-light);
      border-radius:8px; background:rgba(0,0,0,0.15);
      color:var(--bone-dim); font-size:22px; font-weight:300;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:var(--transition); flex-shrink:0;
      font-family:'JetBrains Mono',monospace; line-height:1; padding-bottom:2px; }
    .add-die-btn:hover { border-color:var(--blood-bright);
      color:var(--blood-bright); background:var(--blood-glow); transform:scale(1.05); }

    .pt-icon-wrap { position:relative; width:110px; height:110px; margin:10px auto 6px;
      display:flex; align-items:center; justify-content:center; }
    .pt-icon-wrap img { position:absolute; inset:0; width:100%; height:100%;
      object-fit:contain; z-index:0; filter:drop-shadow(0 0 18px var(--blood-glow)); }
    .pt-icon-wrap .pt-numero { position:relative; z-index:1;
      font-family:'Anton',sans-serif; font-size:32px; padding-top: 45px; color:#fff; line-height:1;
      text-shadow:0 2px 8px #000, 0 0 10px #000, 0 0 20px rgba(212,63,52,0.7); margin-top:-4px; }

    .capa-card { display:flex; align-items:center; gap:16px;
      background:var(--bg-card); backdrop-filter:blur(8px);
      border:1px solid var(--border); border-radius:var(--radius);
      padding:14px 20px; margin-bottom:10px; cursor:pointer;
      transition:border-color var(--transition), transform var(--transition); }
    .capa-card:hover { border-color:var(--blood-bright); transform:translateX(4px); }

    .avatar-upload-area { display:flex; flex-direction:column; align-items:center; gap:10px;
      padding:16px; margin-bottom:16px; background:rgba(0,0,0,0.2);
      border:1px dashed var(--border-light); border-radius:var(--radius); }
    .avatar-preview-container { width:100px; height:100px; border-radius:50%; overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at 30% 30%, rgba(212,63,52,0.15), transparent 70%);
      border:3px solid var(--border); box-shadow:0 0 20px rgba(0,0,0,0.4); }
    .avatar-preview-container img { width:100%; height:100%; object-fit:cover; display:block; }
    .avatar-placeholder { font-size:40px; opacity:0.35; }

    /* ===== MARCADORES ESPECIAIS ===== */
.marcador-item.especial {
  border-color: rgba(201,131,58,0.5);
  background: rgba(201,131,58,0.06);
}
.marcador-hint {
  font-size: 9px;
  line-height: 1.4;
  color: var(--amber);
  text-align: center;
  padding: 4px 6px;
  margin-top: 4px;
  background: rgba(201,131,58,0.1);
  border: 1px solid rgba(201,131,58,0.3);
  border-radius: 6px;
  font-style: italic;
}

/* ===== CENA DE SUSPENSE (JOGADOR) ===== */
.suspense-painel {
  background:
    radial-gradient(circle at 20% 30%, rgba(56,189,248,0.10), transparent 55%),
    linear-gradient(135deg, rgba(20,60,90,0.25) 0%, rgba(0,0,0,0.4) 100%);
  border: 2px solid #1e3a5f;
  border-left: 4px solid var(--sky);
  border-radius: 4px 16px 16px 4px;

    function tocarTom(freq, dur, tipo = 'sine', vol = 0.15, atraso = 0) {
      const ctx = getAudioCtx(); if (!ctx) return;

   async function comprimirImagem(file, maxLado = 1400, qualidade = 0.82) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;

                if (width > maxLado || height > maxLado) {
                    if (width >= height) {
                        height = Math.round((height * maxLado) / width);
                        width = maxLado;
                    } else {
                        width = Math.round((width * maxLado) / height);
                        height = maxLado;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const dataUrl = canvas.toDataURL('image/jpeg', qualidade);
                resolve(dataUrl.split(',')[1]);
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function uploadImagemImgBB(file) {
    if (!file.type.startsWith('image/')) { toast('Escolha uma imagem.', 'erro'); return null; }
    if (file.size > 15 * 1024 * 1024) { toast('Máximo 15 MB.', 'erro'); return null; }

    let base64;
    try {
        base64 = await comprimirImagem(file);
    } catch (e) {
        console.error('Erro ao comprimir:', e);
        toast('Não consegui processar a imagem.', 'erro');
        return null;
    }

    const formData = new FormData();
    formData.append('image', base64);
    try {
        const resposta = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method:'POST', body:formData });
        const dados = await resposta.json();
        if (!dados.success) throw new Error('Falha');
        return dados.data.url;
    } catch (e) {
        console.error('Erro upload:', e);
        toast('Não consegui enviar a foto.', 'erro');
        return null;
    }
}

    window.rolarMesa = async () => {
      const d = campanhaEstado.sobreviventes.find(s => s.id === fichaAberta);
      if (!d) return;
      const mesaDice = todosDados.filter(x => x.zona === 'mesa');
      if (!mesaDice.length) { toast('Arraste dados pra mesa primeiro.', 'erro'); return; }

      const atributo = document.getElementById('t-atributo')?.value || (d.especialidades||[])[0] || 'Agilidade';
      const risco = Number(document.getElementById('t-risco')?.value || 1);
      let dificuldade = 4;
      if ((d.especialidades || []).includes(atributo)) dificuldade -= 1;
      let necessarios = risco;
      if (recursoAtivo) { dificuldade -= 1; if (necessarios > 1) necessarios -= 1; }
      dificuldade = Math.max(2, dificuldade);

      window.somDado();                                       // ⬅️ ITEM 18
      mesaDice.forEach(die => die.estado = 'rolling');
      renderFichaCompleta(d);
      await new Promise(r => setTimeout(r, 900));

      let sucessos = 0, falhas = 0;
      const valores = [];
      mesaDice.forEach(die => {
        die.valor = 1 + Math.floor(Math.random() * 6);
        valores.push(die.valor);
        if (die.valor >= dificuldade) { die.estado = 'success'; sucessos++; }
        else { die.estado = 'fail'; falhas++; }
      });

      const passou = sucessos >= necessarios;
      passou ? window.somCritico() : window.somFalha();       // ⬅️ ITEM 18
      renderFichaCompleta(d);
      await new Promise(r => setTimeout(r, 800));

      // ⬇️ PATCH 1.1 - falhas vão pro lugar certo baseado na cena
      const cenaAtual = campanhaEstado.info?.cena || 'encontro';
      const cenaEhEncontro = (cenaAtual === 'encontro');
      let falhasDescartadas = 0;
      let falhasSacrificadas = 0;

      mesaDice.forEach(die => {
        if (die.estado === 'success') {
          die.zona = 'comum';
          die.estado = 'normal';
        } else if (cenaEhEncontro) {
          die.zona = 'descartados';
          die.estado = 'normal';
          falhasDescartadas++;
        } else {
          die.zona = 'sacrificados';
          die.estado = 'normal';
          falhasSacrificadas++;
        }
      });

      if (falhasSacrificadas > 0) {
        try {
          const assassinoRef = window.fsDoc(window.db, 'campanhas', campanhaCodigo, 'assassino', 'ficha');
          const snapA = await window.fsGetDoc(assassinoRef);
          const dadosAtuais = snapA.exists() ? (snapA.data().dados || 0) : 0;
          await window.fsSetDoc(assassinoRef, { ...(snapA.exists() ? snapA.data() : {}), dados: dadosAtuais + falhasSacrificadas }, { merge: true });
        } catch (e) { console.error('Erro ao creditar sacrifício:', e); }
      }

      if (falhasDescartadas > 0) {
        try {
          const campRef = window.fsDoc(window.db, 'campanhas', campanhaCodigo);
          const snapC = await window.fsGetDoc(campRef);
          const descAtual = snapC.exists() ? (snapC.data().descarte?.valor || 0) : 0;

      });

      if (recursoAtivo) await consumirRecursoAtivo();
      const cenaLabel = cenaAtual === 'livre' ? 'Livre' : cenaAtual === 'suspense' ? 'Suspense' : 'Encontro';

    window.descartarMesa = async () => {
      const mesaDice = todosDados.filter(x => x.zona === 'mesa');
      if (!mesaDice.length) { toast('Nada na mesa.', 'erro'); return; }
      mesaDice.forEach(die => { die.zona = 'descartados'; die.estado = 'normal'; });
      await syncContagens();
      const campRef = window.fsDoc(window.db, 'campanhas', campanhaCodigo);
      const snapC = await window.fsGetDoc(campRef);
      const descAtual = snapC.exists() ? (snapC.data().descarte?.valor || 0) : 0;
      await window.fsUpdateDoc(campRef, { descarte: { valor: descAtual + mesaDice.length } });
      const d = campanhaEstado.sobreviventes.find(s => s.id === fichaAberta);
      if (d) renderFichaCompleta(d);
      toast(`${mesaDice.length} dado(s) descartado(s).`, 'info');
    };

    window.sacrificarMesa = async () => {
      const mesaDice = todosDados.filter(x => x.zona === 'mesa');
      if (!mesaDice.length) { toast('Nada na mesa.', 'erro'); return; }
      const qtd = mesaDice.length;
      todosDados = todosDados.filter(x => x.zona !== 'mesa');
      await syncContagens();

      try {
        const assassinoRef = window.fsDoc(window.db, 'campanhas', campanhaCodigo, 'assassino', 'ficha');
        const snap = await window.fsGetDoc(assassinoRef);
        const dadosAtuais = snap.exists() ? (snap.data().dados || 0) : 0;
        await window.fsSetDoc(assassinoRef, { ...(snap.exists() ? snap.data() : {}), dados: dadosAtuais + qtd }, { merge: true });
      } catch (e) { console.error('Erro ao creditar dados ao Assassino:', e); }

      const d = campanhaEstado.sobreviventes.find(s => s.id === fichaAberta);
      if (d) renderFichaCompleta(d);
      toast(`${qtd} dado(s) sacrificado(s) ao Assassino.`, 'erro');
    };

    window.adicionarMarcador = async () => {

      const ref = window.fsDoc(window.db, 'campanhas', campanhaCodigo, 'sobreviventes', fichaAberta);
      const snap = await window.fsGetDoc(ref);
      if (!snap.exists()) return;
      const marcadores = [...(snap.data().marcadores||[]), { nome, valor: 1 }];
      await window.fsUpdateDoc(ref, { marcadores });
      if (input) input.value = '';

      if (!snap.exists()) return;
      const marcadores = (snap.data().marcadores||[]).map((m,i) =>

      await window.fsUpdateDoc(ref, { marcadores });

      if (campo === 'ferida') {
        let novo = (ferida === valorClicado) ? ferida - 1 : valorClicado;
        if (novo < sequela) { toast('Ferida não pode ser menor que a Sequela.', 'erro'); return; }

      } else if (campo === 'sequela') {
        let novo = (sequela === valorClicado) ? sequela - 1 : valorClicado;
        if (novo > sequela && ferida < novo) ferida = novo;
        sequela = novo;
      }
      await window.fsUpdateDoc(ref, { ferida, sequela });
    };

function getSuspenseAtual() {

async function resolverAbordagemDireta(caminhoId) {
  const s = getSuspenseAtual();
  if (!s) return;
  const d = campanhaEstado.sobreviventes.find(x => x.id === fichaAberta);
  const caminho = s.caminhos.find(c => c.id === caminhoId);

  // Procura armadilha não ativada nesse caminho
  const armadilha = s.armadilhas.find(a => a.caminhoId === caminhoId && !a.ativada);

  if (armadilha) {
    // Marca ativada
    s.armadilhas = s.armadilhas.map(a => a.id === armadilha.id ? { ...a, ativada: true } : a);
    await window.fsUpdateDoc(window.fsDoc(window.db, 'campanhas', campanhaCodigo), { suspense: s });

    await window.fsAddDoc(window.fsCollection(window.db, 'campanhas', campanhaCodigo, 'log'), {
      nomeUsuario: perfilAtual.nomeUsuario,
      sobrevivente: d.nome,
      sobreviventeId: d.id,
      cena: 'suspense',
      tipo: 'suspense',
      valores: [], sucessos: 0, falhas: 0, necessarios: 0,
      resultado: 'falha',
      ts: Date.now()
    });

    toast(`⚔ ${d.nome} foi direto em "${caminho.nome}" e ativou: ${armadilha.nome}`, 'erro');
  } else {
    toast(`✓ ${d.nome} explorou "${caminho.nome}" sem incidentes.`, 'info');
  }
}

// ===== SUSPENSE: consome dados da mesa =====
window.resolverSuspenseComMesa = async (caminhoId, abordagem) => {
  const s = getSuspenseAtual();
  if (!s || !s.ativa) { toast('Nenhuma cena de suspense ativa.', 'erro'); return; }
  const d = campanhaEstado.sobreviventes.find(x => x.id === fichaAberta);
  if (!d) return;
  const caminho = s.caminhos.find(c => c.id === caminhoId);
  if (!caminho) return;

  // ===== Direta: não precisa de dados =====
  if (abordagem === 'direta') {
    const armadilha = s.armadilhas.find(a => a.caminhoId === caminhoId && !a.ativada);
    if (armadilha) {
      s.armadilhas = s.armadilhas.map(a => a.id === armadilha.id ? { ...a, ativada: true } : a);
      await window.fsUpdateDoc(window.fsDoc(window.db, 'campanhas', campanhaCodigo), { suspense: s });
      await window.fsAddDoc(window.fsCollection(window.db, 'campanhas', campanhaCodigo, 'log'), {
        nomeUsuario: perfilAtual.nomeUsuario,
        sobrevivente: d.nome,
        sobreviventeId: d.id,
        cena: 'suspense',
        tipo: 'suspense',
        abordagem: 'direta',
        valores: [], sucessos: 0, falhas: 0, necessarios: 0,
        resultado: 'falha', ts: Date.now()
      });
      toast(`⚔ ${d.nome} foi direto em "${caminho.nome}" e ativou: ${armadilha.nome}`, 'erro');
    } else {
      toast(`✓ ${d.nome} explorou "${caminho.nome}" sem incidentes.`, 'info');
    }
    renderFichaCompleta(d);
    return;
  }

  // ===== Investigativa / Cautelosa: pega dados da mesa =====
  const mesaDice = todosDados.filter(x => x.zona === 'mesa');
  if (!mesaDice.length) {
    toast('Arraste dados pra mesa de rolagem primeiro.', 'erro');
    return;
  }

  const atributo = document.getElementById('t-atributo')?.value || 'Agilidade';
  const necessarios = (abordagem === 'investigativa') ? 2 : 1;

  let dificuldade = 4;
  if ((d.especialidades || []).includes(atributo)) dificuldade -= 1;
  if (recursoAtivo) dificuldade -= 1;
  dificuldade = Math.max(2, dificuldade);

  // Anima
  window.somDado();                                           // ⬅️ ITEM 18
  mesaDice.forEach(die => die.estado = 'rolling');
  renderFichaCompleta(d);
  await new Promise(r => setTimeout(r, 800));

  // Sorteia valores
  let sucessos = 0, falhas = 0;
  const valores = [];
  mesaDice.forEach(die => {
    die.valor = 1 + Math.floor(Math.random() * 6);
    valores.push(die.valor);
    if (die.valor >= dificuldade) { die.estado = 'success'; sucessos++; }
    else { die.estado = 'fail'; falhas++; }
  });
  const passou = sucessos >= necessarios;
  passou ? window.somCritico() : window.somFalha();           // ⬅️ ITEM 18
  renderFichaCompleta(d);
  await new Promise(r => setTimeout(r, 700));

  // ===== Move os dados pra fora da mesa =====
  const cenaAtual = (campanhaEstado.info && campanhaEstado.info.cena) || 'suspense';
  const cenaEhEncontro = (cenaAtual === 'encontro');
  let falhasDescartadas = 0, falhasSacrificadas = 0;

  mesaDice.forEach(die => {
    if (die.estado === 'success') {
      die.zona = 'comum';
      die.estado = 'normal';
    } else if (cenaEhEncontro) {
      die.zona = 'descartados';
      die.estado = 'normal';
      falhasDescartadas++;
    } else {
      die.zona = 'sacrificados';
      die.estado = 'normal';
      falhasSacrificadas++;
    }
  });

  if (falhasSacrificadas > 0) {
    try {
      const assassinoRef = window.fsDoc(window.db, 'campanhas', campanhaCodigo, 'assassino', 'ficha');
      const snapA = await window.fsGetDoc(assassinoRef);
      const dadosAt = snapA.exists() ? (snapA.data().dados || 0) : 0;
      await window.fsSetDoc(assassinoRef, { ...(snapA.exists() ? snapA.data() : {}), dados: dadosAt + falhasSacrificadas }, { merge: true });
    } catch (e) { console.error(e); }
  }
  if (falhasDescartadas > 0) {
    const campRef = window.fsDoc(window.db, 'campanhas', campanhaCodigo);
    const snapC = await window.fsGetDoc(campRef);
    const descAt = snapC.exists() ? (snapC.data().descarte?.valor || 0) : 0;
    await window.fsUpdateDoc(campRef, { descarte: { valor: descAt + falhasDescartadas } });
  }

  // Atualiza pilha da sobrevivente (só os sucessos voltam; restante já foi embora)
  await syncContagens();

  // ===== Aplica o resultado da ação =====
  if (passou) {
    if (abordagem === 'investigativa') {
      const passo = s.passos.find(p => p.caminhoId === caminhoId && !p.encontrado);
      if (passo) {
        s.passos = s.passos.map(p => p.id === passo.id ? { ...p, encontrado: true } : p);
        await window.fsUpdateDoc(window.fsDoc(window.db, 'campanhas', campanhaCodigo), { suspense: s });
        toast(`✦ ${d.nome} descobriu: ${passo.nome}!`, 'sucesso');
      } else {
        toast(`✓ ${d.nome} investigou "${caminho.nome}". Nada novo aqui.`, 'info');
      }
    } else if (abordagem === 'cautelosa') {
      const armadilha = s.armadilhas.find(a => a.caminhoId === caminhoId && !a.ativada);
      if (armadilha) {
        s.armadilhas = s.armadilhas.map(a => a.id === armadilha.id ? { ...a, ativada: true } : a);
        await window.fsUpdateDoc(window.fsDoc(window.db, 'campanhas', campanhaCodigo), { suspense: s });
        toast(`🛡 ${d.nome} desarmou: ${armadilha.nome}.`, 'sucesso');
      } else {
        toast(`✓ ${d.nome} cuidou de "${caminho.nome}". Sem armadilhas.`, 'info');
      }
    }
  } else {
    toast(`✗ ${d.nome} falhou em "${caminho.nome}" (${sucessos}/${necessarios} sucessos).`, 'erro');
  }

  if (recursoAtivo) await consumirRecursoAtivo();

  // ⬇️ ITEM 14/19 - Log enriquecido
  await window.fsAddDoc(window.fsCollection(window.db, 'campanhas', campanhaCodigo, 'log'), {
    nomeUsuario: perfilAtual.nomeUsuario,
    sobrevivente: d.nome,
    sobreviventeId: d.id,
    cena: 'suspense',
    tipo: 'suspense',
    abordagem,
    valores, sucessos, falhas, necessarios,
    resultado: passou ? 'sucesso' : 'falha',
    ts: Date.now()
  });
  limparLogsAntigos(campanhaCodigo, 30);

  const d2 = campanhaEstado.sobreviventes.find(x => x.id === fichaAberta);
  if (d2) renderFichaCompleta(d2);
};

// Mostra quantos dados estão prontos na mesa
function contarDadosMesa() {
  return todosDados.filter(x => x.zona === 'mesa').length;
}

function renderSuspenseAbaHtml() {
  const s = getSuspenseAtual();
  if (!s || !s.ativa) return '<p class="empty">Nenhuma cena de suspense ativa agora.</p>';

  const d = campanhaEstado.sobreviventes.find(x => x.id === fichaAberta);
  const totalPassos = s.passos.length;
  const encontrados = s.passos.filter(p => p.encontrado).length;
  const dadosNaMesa = contarDadosMesa();
  const temDados = dadosNaMesa > 0;

  return `
    <div class="suspense-painel">
      <div class="s-titulo">🕯️ Cena de Suspense</div>
      ${s.resolucao.titulo ? `<div class="s-resolucao"><b>Objetivo:</b> ${window.escapeHtml(s.resolucao.titulo)}${s.resolucao.desc ? `<br><span style="color:var(--bone-dim);font-size:12px;">${window.escapeHtml(s.resolucao.desc)}</span>` : ''}</div>` : ''}
      ${totalPassos > 0 ? `<div class="s-progresso"><span>Passos descobertos:</span><b>${encontrados} / ${totalPassos}</b>${encontrados === totalPassos ? ' <span style="color:var(--sick);">✓ RESOLUÇÃO PRONTA</span>' : ''}</div>` : ''}

      <div style="background:rgba(0,0,0,0.35); border-left:3px solid ${temDados ? 'var(--sick)' : 'var(--amber)'}; border-radius:0 8px 8px 0; padding:10px 14px; font-size:12.5px; color:${temDados ? 'var(--sick)' : 'var(--amber)'};">
        ${temDados
          ? `🎲 <b>${dadosNaMesa}</b> dado(s) na mesa de rolagem · atributo selecionado: <b>${window.escapeHtml(document.getElementById('t-atributo')?.value || 'Agilidade')}</b>`
          : `⚠ Arraste dados pra <b>Mesa de Rolagem</b> (coluna do meio) antes de Investigar ou Cautelosa.`
        }
      </div>
    </div>

    ${s.caminhos.length === 0
      ? '<p class="empty">A Diretora ainda não montou os Caminhos.</p>'
      : s.caminhos.map(c => {
          const passosDoCaminho = s.passos.filter(p => p.caminhoId === c.id);
          const armadilhasDoCaminho = s.armadilhas.filter(a => a.caminhoId === c.id);
          const temPassoPraAchar = passosDoCaminho.some(p => !p.encontrado);
          const temArmadilhaAtiva = armadilhasDoCaminho.some(a => !a.ativada);
          const exploradoTotalmente = !temPassoPraAchar && !temArmadilhaAtiva && (passosDoCaminho.length || armadilhasDoCaminho.length);
          const podeInvestigar = temPassoPraAchar && temDados;
          const podeCautelosa = temArmadilhaAtiva && temDados;

          return `
            <div class="s-caminho-card">
              <div class="nome">${window.escapeHtml(c.nome)}</div>
              ${c.desc ? `<div class="desc">${window.escapeHtml(c.desc)}</div>` : ''}
              ${(passosDoCaminho.length || armadilhasDoCaminho.length) ? `
                <div class="chips">
                  ${passosDoCaminho.map(p => p.encontrado
                    ? `<span class="chip-passo encontrado">✦ ${window.escapeHtml(p.nome)}</span>`
                    : `<span class="chip-passo" style="opacity:0.4;">? Passo oculto</span>`
                  ).join('')}
                  ${armadilhasDoCaminho.map(a => a.ativada
                    ? `<span class="chip-armadilha ativada">⚔ ${window.escapeHtml(a.nome)}</span>`
                    : `<span class="chip-armadilha" style="opacity:0.4;">⚠ Armadilha ativa</span>`
                  ).join('')}
                </div>
              ` : ''}

              ${exploradoTotalmente
                ? `<p class="meta" style="text-align:center; margin:0;">Este caminho já foi totalmente explorado.</p>`
                : `<div class="s-abordagens">
                    <button class="s-abordagem-btn direta" onclick="resolverSuspenseComMesa('${c.id}', 'direta')">
                      ⚡ Direta
                      <span class="sub">Sem dados · risco de armadilha</span>
                    </button>
                    <button class="s-abordagem-btn" onclick="resolverSuspenseComMesa('${c.id}', 'investigativa')" ${podeInvestigar ? '' : 'disabled style="opacity:0.35; cursor:not-allowed;"'}>
                      🔍 Investigar
                      <span class="sub">${temPassoPraAchar ? (temDados ? '2 sucessos · revela Passo' : 'precisa de dados na mesa') : 'nenhum Passo aqui'}</span>
                    </button>
                    <button class="s-abordagem-btn" onclick="resolverSuspenseComMesa('${c.id}', 'cautelosa')" ${podeCautelosa ? '' : 'disabled style="opacity:0.35; cursor:not-allowed;"'}>
                      🛡 Cautelosa
                      <span class="sub">${temArmadilhaAtiva ? (temDados ? '1 sucesso · desarma armadilha' : 'precisa de dados na mesa') : 'nenhuma armadilha aqui'}</span>
                    </button>
                  </div>`
              }
            </div>
          `;
        }).join('')
    }
  `;
}

    window.avancarIniciativa = async () => {
      const atual = campanhaEstado.info?.iniciativa || { indice: 0 };
      const arq = new Set((campanhaEstado.sobreviventes||[]).map(s => s.arquetipo));
      const ordem = INICIATIVA_ORDEM.filter(a => a === 'Assassino' || arq.has(a));
      const total = Math.max(ordem.length, 1);
      const novo = (atual.indice + 1) % total;
      await window.fsUpdateDoc(window.fsDoc(window.db, 'campanhas', campanhaCodigo), { iniciativa: { indice: novo } });
    };

    async function consumirRecursoAtivo() {
      if (!recursoAtivo || !fichaAberta) return;
      const ref = window.fsDoc(window.db, 'campanhas', campanhaCodigo, 'sobreviventes', fichaAberta);
      const snap = await window.fsGetDoc(ref);
      if (!snap.exists()) { recursoAtivo = null; return; }
      const recursos = (snap.data().recursos||[]).map((r,i) => i===recursoAtivo.idx ? {...r, usos: r.usos-1} : r).filter(r => r.usos > 0);
      await window.fsUpdateDoc(ref, { recursos });
      recursoAtivo = null;
    }

    window.acaoRecuperarFolego = async () => {
      if (!fichaAberta) return;
      const atual = todosDados.filter(x => x.zona === 'comum').length;
      if (atual >= LIMITE_COMUM) { toast(`Pilha comum já está cheia (${LIMITE_COMUM}).`, 'erro'); return; }
      todosDados.push(novoDado('comum'));
      await syncContagens();
      const d = campanhaEstado.sobreviventes.find(s => s.id === fichaAberta);
      if (d) renderFichaCompleta(d);
      toast('+1 dado comum.', 'sucesso');
    };

    window.acaoArriscarTudo = async () => {
      if (!fichaAberta) { toast('Nenhuma ficha aberta.', 'erro'); return; }

      if (!confirm('Arriscar Tudo descarta TODOS os seus dados e te faz escapar automaticamente. Continuar?')) {
        return;
      }

      const ref = window.fsDoc(window.db, 'campanhas', campanhaCodigo, 'sobreviventes', fichaAberta);
      const snap = await window.fsGetDoc(ref);
      if (!snap.exists()) { toast('Ficha não encontrada.', 'erro'); return; }
      const d = snap.data();

      if (d.arriscouTudo) {
        toast('Já Arriscou Tudo nesta sessão. Use o botão de reset se a sessão já virou.', 'erro');
        return;
      }

      const meusDados = todosDados.filter(x => x.zona === 'comum' || x.zona === 'mesa');
      if (!meusDados.length) {
        toast('Você não tem dados pra descartar.', 'erro');
        return;
      }

      meusDados.forEach(die => { die.zona = 'descartados'; die.estado = 'normal'; });

      await window.fsUpdateDoc(ref, { arriscouTudo: true });

      await syncContagens();
      const d2 = campanhaEstado.sobreviventes.find(s => s.id === fichaAberta);
      if (d2) renderFichaCompleta(d2);

      toast(`${d.nome} arriscou tudo e escapou!`, 'sucesso');
    };

    window.resetarArriscarTudo = async () => {
      if (!fichaAberta) return;
      if (!confirm('Resetar "Arriscou Tudo"? Use isso só quando uma nova sessão começar.')) return;
      const ref = window.fsDoc(window.db, 'campanhas', campanhaCodigo, 'sobreviventes', fichaAberta);
      await window.fsUpdateDoc(ref, { arriscouTudo: false });
      toast('Arriscou Tudo resetado para esta nova sessão.', 'sucesso');
    };

    function renderLog(entradas) {
      const el = document.getElementById('dice-log');
      if (!el) return;
      if (!entradas.length) { el.innerHTML = '<p class="empty">Nenhuma rolagem registrada.</p>'; return; }
      el.innerHTML = entradas.slice().reverse().map(d =>
        `<div class="log-entry"><b>${window.escapeHtml(d.nomeUsuario)}</b> [${(d.valores||[]).join(', ')}] → ${d.sucessos} sucesso(s) — <b>${d.resultado.toUpperCase()}</b></div>`
      ).join('');
    }

    async function limparLogsAntigos(codigo, limite = 30) {
      try {
        const q = window.fsQuery(
          window.fsCollection(window.db, 'campanhas', codigo, 'log'),
          window.fsOrderBy('ts', 'desc')
        );
        const snap = await window.fsGetDocs(q);
        if (snap.size > limite) {
          const praDeletar = snap.docs.slice(limite);
          await Promise.all(praDeletar.map(d => window.fsDeleteDoc(d.ref)));
          console.log(`[BRUTAL] Limpou ${praDeletar.length} logs antigos.`);
        }
      } catch (e) {
        console.warn('[BRUTAL] Erro ao limpar logs:', e);
      }
    }

    renderizarJogador();
  </script>
</body>
