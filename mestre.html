<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRUTAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Butcherman&family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0b0808;
      --bg-elev-1: rgba(26,18,17,0.75);
      --bg-elev-2: rgba(32,22,20,0.85);
      --border: rgba(61,42,38,0.5);
      --border-light: rgba(61,42,38,0.25);
      --blood: #a02020;
      --blood-bright: #d43f34;
      --blood-glow: rgba(212,63,52,0.25);
      --blood-soft: rgba(212,63,52,0.08);
      --bone: #f0ede8;
      --bone-dim: #9a8c82;
      --bone-faint: rgba(154,140,130,0.5);
      --sick: #88c05b;
      --sick-glow: rgba(136,192,91,0.25);
      --amber: #c9833a;
      --amber-glow: rgba(201,131,58,0.2);
      --sky: #38bdf8;
      --violet: #a78bfa;
      --pink: #f472b6;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,0.6);
      --shadow-deep: 0 20px 60px rgba(0,0,0,0.75);
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
      --transition-slow: 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    html { height: 100%; }
    body {
      background: var(--bg);
      color: var(--bone);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: 0.005em;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
    input, select, textarea { font:inherit; color:inherit; background:transparent; border:none; outline:none; }
    img { max-width: 100%; display: block; }

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url('img/fundo.png');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  opacity: 0.28;                 /* era 0.12 → agora 0.28 */
  z-index: 0;
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 15% 15%, rgba(212,63,52,0.08), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(201,131,58,0.05), transparent 45%),
    radial-gradient(circle at 50% 50%, transparent 35%, rgba(0,0,0,0.35) 100%); /* era 0.55 → 0.35 */
  pointer-events: none;
  z-index: 0;
}
    body > * { position: relative; z-index: 1; }

    h1, h2, h3, h4, .display {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .logo {
      font-family: 'Butcherman', cursive;
      font-size: 30px;
      background: linear-gradient(135deg, var(--blood-bright), var(--blood));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px var(--blood-glow));
      line-height: 1;
      letter-spacing: 0.04em;
    }
    .logo small {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--bone-dim);
      -webkit-text-fill-color: var(--bone-dim);
      text-transform: uppercase;
      margin-top: -2px;
      font-weight: 600;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(180deg, rgba(11,8,8,0.96) 0%, rgba(11,8,8,0.85) 100%);
      backdrop-filter: blur(14px);
      padding: 14px 32px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    header::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--blood-bright) 50%, transparent 100%);
      opacity: 0.5;
    }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .hero {
      padding: 32px 36px;
      margin-bottom: 28px;
      border-radius: 6px 24px 24px 6px;
      background:
        radial-gradient(circle at 0% 50%, rgba(212,63,52,0.18), transparent 55%),
        linear-gradient(135deg, rgba(139,0,0,0.15) 0%, rgba(0,0,0,0.35) 100%);
      border: 1px solid var(--border);
      border-left: 4px solid var(--blood-bright);
      box-shadow: var(--shadow), inset 0 0 60px rgba(139,0,0,0.1);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 240px; height: 240px;
      background: radial-gradient(circle, rgba(212,63,52,0.2), transparent 65%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute; bottom: 0; right: 0;
      width: 180px; height: 180px;
      background-image:
        linear-gradient(45deg, transparent 45%, rgba(212,63,52,0.06) 50%, transparent 55%);
      background-size: 20px 20px;
      opacity: 0.6;
      pointer-events: none;
    }
    .hero-top {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 12px;
      font-family: 'Anton', sans-serif;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--blood-bright);
      position: relative; z-index: 1;
    }
    .hero-top::before {
      content: '';
      width: 30px; height: 2px;
      background: var(--blood-bright);
      box-shadow: 0 0 12px var(--blood-glow);
    }
    .hero-titulo {
      font-family: 'Anton', sans-serif;
      font-size: clamp(32px, 4.5vw, 48px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      color: var(--bone);
      margin-bottom: 16px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
      position: relative; z-index: 1;
    }
    .hero-titulo span {
      color: var(--blood-bright);
      text-shadow: 0 0 24px var(--blood-glow);
    }
    .hero-meta {
      display: flex; gap: 24px; flex-wrap: wrap;
      align-items: center;
      position: relative; z-index: 1;
    }
    .hero-meta-item {
      display: flex; flex-direction: column; gap: 3px;
    }
    .hero-meta-item .lbl {
      font-family: 'Anton', sans-serif;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--bone-dim);
    }
    .hero-meta-item .val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--bone);
      display: flex; align-items: center; gap: 8px;
    }
    .hero-codigo {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.4);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--bone);
      letter-spacing: 0.06em;
    }
    .hero-codigo button {
      color: var(--blood-bright);
      font-size: 14px;
      padding: 0;
      transition: transform var(--transition);
    }
    .hero-codigo button:hover { transform: scale(1.2); }

    .master-tabs {
      display: flex; gap: 6px;
      border-bottom: 2px solid var(--border-light);
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .master-tab {
      padding: 14px 24px 16px;
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bone-dim);
      border-bottom: 2px solid transparent;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      background: transparent;
    }
    .master-tab::after {
      content: '';
      position: absolute; bottom: -2px; left: 0; width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blood-bright), transparent);
      transform: scaleX(0);
      transition: transform var(--transition);
    }
    .master-tab:hover { color: var(--bone); }
    .master-tab.active {
      color: var(--bone);
      background: linear-gradient(180deg, var(--blood-soft) 0%, transparent 100%);
    }
    .master-tab.active::after { transform: scaleX(1); }

.card {
  background: var(--bg-card);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  transition: border-color var(--transition);
  margin-bottom: 20px;
  position: relative;             /* ⬅️ NOVO */
  overflow: hidden;               /* ⬅️ NOVO */
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url('img/fundo.png');
  background-size: cover;
  background-position: center;
  opacity: 0.14;                  /* ajuste fino aqui */
  pointer-events: none;
  border-radius: inherit;
  z-index: 0;
}
.card > * { position: relative; z-index: 1; }
    .card:hover {
      border-color: rgba(212,63,52,0.35);
      transform: translateY(-2px);
    }
    .card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg,
        transparent 0%,
        var(--blood-bright) 20%,
        var(--blood-bright) 80%,
        transparent 100%);
      opacity: 0.55;
      transition: opacity var(--transition);
    }
    .card:hover::before { opacity: 1; }
    .card::after {
      content: '';
      position: absolute; top: 0; right: 0;
      width: 80px; height: 80px;
      background: linear-gradient(225deg, rgba(212,63,52,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .card .card {
      border-radius: var(--radius-sm);
      padding: 20px;
      box-shadow: none;
      background: rgba(0,0,0,0.25);
      animation: none;
    }
    .card .card::before,
    .card .card::after { display: none; }
    .card .card:hover { transform: none; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:nth-child(1) { animation-delay: 0.02s; }
    .card:nth-child(2) { animation-delay: 0.06s; }
    .card:nth-child(3) { animation-delay: 0.10s; }
    .card:nth-child(4) { animation-delay: 0.14s; }
    .card:nth-child(5) { animation-delay: 0.18s; }
    .card:nth-child(6) { animation-delay: 0.22s; }

    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
      position: relative;
      flex-wrap: wrap; gap: 12px;
    }
    .card-header::after {
      content: '';
      position: absolute; bottom: -2px; left: 0;
      width: 42px; height: 2px;
      background: var(--blood-bright);
      box-shadow: 0 0 12px var(--blood-glow);
    }
    .card-header h2 {
      font-size: 30px; color: var(--bone);
      display: flex; align-items: center; gap: 14px;
    }
    .card-header h4 {
      font-size: 17px; color: var(--bone);
      display: flex; align-items: center; gap: 12px;
      letter-spacing: 0.08em;
    }
    .card-header .header-icon {
      font-size: 20px;
      filter: drop-shadow(0 0 8px var(--blood-glow));
      flex-shrink: 0;
    }
    .card-header .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      background: var(--blood-soft);
      border: 1px solid rgba(212,63,52,0.3);
      color: var(--blood-bright);
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 999px;
      white-space: nowrap;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      background: rgba(26,18,17,0.7);
      color: var(--bone);
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute; top: 50%; left: 50%;
      width: 0; height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      transform: translate(-50%, -50%);
      transition: width 0.45s ease, height 0.45s ease;
      pointer-events: none;
    }
    .btn:hover::after { width: 320px; height: 320px; }
    .btn:hover {
      background: var(--blood);
      border-color: var(--blood-bright);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--blood-glow);
    }
    .btn.ghost { background: transparent; border-color: var(--border-light); }
    .btn.ghost:hover {
      background: var(--blood-soft);
      border-color: var(--blood-bright);
      transform: none;
      box-shadow: none;
    }
    .btn.small { padding: 7px 14px; font-size: 10.5px; border-radius: 6px; }
    .btn.sick {
      background: rgba(136,192,91,0.1);
      border-color: var(--sick);
      color: var(--sick);
    }
    .btn.sick:hover { background: var(--sick); color: var(--bg); }
    .btn:disabled {
      opacity: 0.35; pointer-events: none; transform: none !important;
    }

    /* Botão de cena ativo */
    .btn.cena-ativo {
      background: var(--blood) !important;
      border-color: var(--blood-bright) !important;
      color: #fff !important;
      box-shadow: 0 0 12px var(--blood-glow);
    }

    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
    .field {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 14px; flex: 1; min-width: 140px;
    }
    .field label {
      font-family: 'Anton', sans-serif;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--bone-dim);
    }
    .field input, .field select {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-light);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--bone);
      transition: var(--transition);
    }
    .field input:focus, .field select:focus {
      border-color: var(--blood-bright);
      box-shadow: 0 0 0 3px var(--blood-glow);
      background: rgba(0,0,0,0.5);
    }
    .field input:hover, .field select:hover {
      border-color: var(--blood);
      background: rgba(0,0,0,0.5);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-color: rgba(0, 0, 0, 0.4);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%23d43f34' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 12px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 12px 40px 12px 16px;
      color: var(--bone);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    select:hover { border-color: var(--blood); background-color: rgba(0, 0, 0, 0.5); }
    select:focus { border-color: var(--blood-bright); box-shadow: 0 0 0 3px var(--blood-glow); outline: none; }
    select option { background: #1a1211; color: var(--bone); padding: 10px; }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border-light);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--bone-dim);
      margin: 3px 4px 3px 0;
      transition: var(--transition);
      flex-wrap: wrap;
    }
    .pill:hover {
      border-color: var(--blood-bright);
      background: var(--blood-soft);
      color: var(--bone);
    }
    .pill b { color: var(--bone); font-weight: 700; }
    .pill.active { border-color: var(--blood-bright); color: var(--bone); }

    .meta { font-size: 13px; color: var(--bone-dim); line-height: 1.65; }
    .meta b { color: var(--bone); font-weight: 600; }

    .empty {
      color: var(--bone-dim);
      padding: 32px 24px;
      text-align: center;
      border: 1px dashed var(--border-light);
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.6;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .empty::before {
      content: '◌';
      font-size: 28px;
      color: var(--bone-faint);
      display: block;
    }

    .initiative {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin: 16px 0;
    }
    .init-step {
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border-light);
      font-size: 12.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--bone-dim);
      transition: var(--transition);
      display: flex; align-items: center; gap: 6px;
    }
    .init-step::before {
      content: '◇';
      color: var(--bone-faint);
      font-size: 10px;
    }
    .init-step.current {
      border-color: var(--sick);
      color: var(--sick);
      background: var(--sick-glow);
      box-shadow: 0 0 16px rgba(136,192,91,0.15);
    }
    .init-step.current::before { content: '◆'; color: var(--sick); }
    .init-step.assassino {
      border-color: var(--blood-bright);
      color: var(--blood-bright);
    }
    .init-step.assassino::before { content: '☠'; color: var(--blood-bright); }
    .init-step.assassino.current {
      background: var(--blood-glow);
      box-shadow: 0 0 20px var(--blood-glow);
    }

    .ability {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border-light);
      border-left: 3px solid transparent;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 16px;
      transition: var(--transition);
    }
    .ability:hover {
      border-left-color: var(--blood-bright);
      background: var(--blood-soft);
      transform: translateX(3px);
    }
    .ability .txt { flex: 1; }
    .ability .txt b {
      color: var(--bone);
      font-size: 14px;
      letter-spacing: 0.02em;
      display: block;
      margin-bottom: 2px;
    }
    .ability .txt p {
      margin: 0;
      font-size: 13px;
      color: var(--bone-dim);
      line-height: 1.6;
    }

    .toast-container {
      position: fixed; top: 20px; right: 20px;
      z-index: 500;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
      max-width: 380px; width: 100%;
    }
    .toast {
      pointer-events: auto;
      background: var(--bg-elev-2);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-left: 4px solid var(--blood-bright);
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      color: var(--bone);
      box-shadow: var(--shadow-deep);
      animation: toastIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.5;
    }
    .toast.sucesso { border-left-color: var(--sick); }
    .toast.erro { border-left-color: var(--blood-bright); }
    .toast.info { border-left-color: var(--amber); }
    .toast.saindo { animation: toastOut 0.2s ease forwards; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(24px) scale(0.95); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateX(24px) scale(0.95); }
    }

    .stack-counter {
      font-family: 'Anton', sans-serif;
      font-size: 56px;
      color: var(--amber);
      line-height: 1;
      text-shadow: 0 0 24px var(--amber-glow);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .stack-counter small {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--bone-dim);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .ameaca-topo {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 24px;
      align-items: center;
      background:
        radial-gradient(circle at 15% 50%, rgba(212,63,52,0.12), transparent 60%),
        linear-gradient(135deg, rgba(139,0,0,0.15) 0%, rgba(0,0,0,0.4) 100%);
      border: 2px solid var(--blood);
      border-radius: 6px 20px 20px 6px;
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: inset 0 0 60px rgba(139,0,0,0.12), var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .ameaca-topo::before {
      content: '';
      position: absolute; top: 0; left: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, transparent, var(--blood-bright), transparent);
    }
    .ameaca-retrato {
      position: relative;

          if (ferida >= 6 && !mortasVistas.has(s.id)) {
            mortasVistas.add(s.id);
            if (!primeiraCargaSob) {
              window.toast(`☠ ${s.nome} MORREU (Ferida 6)!`, 'erro');
              window.somMorte();
            }
          } else if (ferida < 6 && mortasVistas.has(s.id)) {
            mortasVistas.delete(s.id);   // reviveu — permite alertar de novo
          }

        primeiraCargaSob = false;
        renderMestre();

      );

        if (!primeiraCargaLog) {
          const novas = entradas.filter(e => (e.ts || 0) > ultimoLogTs);
          novas.forEach(e => {
            const passou = e.resultado === 'sucesso';
            const quem = e.sobrevivente || e.nomeUsuario || '?';
            const cena = e.cena ? ` · ${e.cena}` : '';
            window.toast(`🎲 ${quem}: ${passou ? 'SUCESSO' : 'FALHA'} (${e.sucessos}/${e.necessarios}${cena})`, passou ? 'sucesso' : 'erro');
            if (e.tipo === 'susto') window.somSusto();
            else if (passou) window.somCritico();
            else window.somFalha();
          });
        }
        if (entradas.length) {
          ultimoLogTs = Math.max(ultimoLogTs, ...entradas.map(e => e.ts || 0));
        }
        primeiraCargaLog = false;

      const valor = 1 + Math.floor(Math.random() * 6);

      if (valor === 6) {
        if (confirm(`Ferir ${nome}: rolou 6 — morte instantânea. Confirmar?`)) {
          mortasVistas.add(id);                     // evita toast duplicado do listener

      const nova = Math.min(6, (atual.ferida || 0) + valor);

   async function comprimirImagem(file, maxLado = 1400, qualidade = 0.82) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;

                if (width > maxLado || height > maxLado) {
                    if (width >= height) {
                        height = Math.round((height * maxLado) / width);
                        width = maxLado;
                    } else {
                        width = Math.round((width * maxLado) / height);
                        height = maxLado;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const dataUrl = canvas.toDataURL('image/jpeg', qualidade);
                resolve(dataUrl.split(',')[1]);
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

    if (!file) return;
    if (!file.type.startsWith('image/')) { toast('Escolha uma imagem.', 'erro'); return; }
    if (file.size > 15 * 1024 * 1024) { toast('Máximo 15 MB.', 'erro'); return; }

    toast('Enviando retrato...', 'info');

    let base64;
    try {
        base64 = await comprimirImagem(file);
    } catch (e) {
        console.error('Erro ao comprimir:', e);
        toast('Não consegui processar a imagem.', 'erro');
        return;
    }

    const formData = new FormData();
    formData.append('image', base64);
    try {
        const resposta = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method:'POST', body:formData });
        const dados = await resposta.json();
        if (!dados.success) throw new Error('Falha');
        const atual = getAssassinoAtual();
        atual.retratoURL = dados.data.url;
        await window.fsSetDoc(assassinoRef(), atual);
        toast('Retrato atualizado.', 'sucesso');
    } catch (e) {
        console.error('Erro upload:', e);
        toast('Não consegui enviar o retrato.', 'erro');
    }
};

window.abrirCicatrizesModal = () => {
  const sobreviventes = (campanhaEstado.sobreviventes || []).filter(s => (s.ferida || 0) < 6);
  const mortas = (campanhaEstado.sobreviventes || []).filter(s => (s.ferida || 0) >= 6);

  if (sobreviventes.length === 0) { toast('Nenhuma sobrevivente viva pra receber Cicatriz.', 'erro'); return; }

  const overlay = document.createElement('div');
  overlay.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); z-index:9000; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;`;
  overlay.innerHTML = `
    <div style="background:var(--bg-elev-2); border:1px solid var(--border); border-left:4px solid var(--blood-bright); border-radius:16px; padding:32px; max-width:820px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-deep);">
      <h2 style="font-family:'Anton',sans-serif; font-size:26px; color:var(--bone); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;">💀 Fim do Thriller</h2>
      <p style="font-size:13px; color:var(--bone-dim); margin-bottom:24px; line-height:1.65;">
        Quem sobreviveu ganha uma Cicatriz — uma nova habilidade do seu arquétipo, do arquétipo de alguém que morreu, ou a ★ Cicatriz de Sobrevivente. Escolha uma pra cada viva abaixo.
      </p>

      ${sobreviventes.map(s => {
        const habs = ARQUETIPOS_MESTRE[s.arquetipo] || [];
        const jaTem = (s.habilidades || []).filter(h => h.tem).map(h => h.idx);
        const opcoesProprias = habs.map((h, i) => ({ arq: s.arquetipo, idx: i, nome: h.n, desc: h.d, morta: false, dono: s.nome }))
          .filter(o => !jaTem.includes(o.idx));
        const opcoesMortas = mortas.flatMap(m => {
          const habsM = ARQUETIPOS_MESTRE[m.arquetipo] || [];
          const jaTemM = (m.habilidades || []).filter(h => h.tem).map(h => h.idx);
          return habsM.map((h, i) => ({ arq: m.arquetipo, idx: i, nome: h.n, desc: h.d, morta: true, dono: m.nome }))
            .filter(o => !jaTemM.includes(o.idx));
        });
        const todasOpcoes = [...opcoesProprias, ...opcoesMortas];

        return `
          <div style="margin-bottom:20px; padding:18px; background:rgba(0,0,0,0.3); border:1px solid var(--border-light); border-radius:12px;">
            <div style="font-family:'Anton',sans-serif; font-size:18px; color:var(--bone); margin-bottom:12px; letter-spacing:0.05em;">
              ${window.escapeHtml(s.nome)} <span style="color:var(--blood-bright); font-size:13px;">· ${s.arquetipo}</span>
            </div>
            <select class="cicatriz-select" data-sid="${s.id}" style="width:100%; background:rgba(0,0,0,0.4); border:1px solid var(--border-light); border-radius:8px; padding:12px 16px; color:var(--bone); font-size:13px; appearance:none;">
              <option value="">— Escolha a Cicatriz —</option>
              ${todasOpcoes.map((o, i) => `
                <option value="${o.arq}|${o.idx}">
                  ${o.morta ? '☠' : '◇'} [${o.arq}] ${o.nome}${o.morta ? ` (de ${o.dono})` : ''}
                </option>
              `).join('')}
            </select>
          </div>
        `;
      }).join('')}

      <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:20px;">
        <button id="cic-cancel" class="btn ghost small">Cancelar</button>
        <button id="cic-confirm" class="btn small" style="background:var(--blood);border-color:var(--blood-bright);color:#fff;">Aplicar Cicatrizes</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#cic-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#cic-confirm').onclick = async () => {
    const selects = overlay.querySelectorAll('.cicatriz-select');
    let aplicadas = 0;

    for (const sel of selects) {
      const sid = sel.dataset.sid;
      const val = sel.value;
      if (!val) continue;
      const [arq, idxStr] = val.split('|');
      const idx = Number(idxStr);

      const snap = await window.fsGetDoc(window.fsDoc(window.db, 'campanhas', campanhaCodigo, 'sobreviventes', sid));
      if (!snap.exists()) continue;
      const s = snap.data();
      const habs = [...(s.habilidades || [])];
      const existente = habs.find(h => h.idx === idx);
      if (existente) {
        existente.tem = true;
      } else {
        habs.push({ idx, tem: true, usado: false });
      }
      await window.fsUpdateDoc(window.fsDoc(window.db, 'campanhas', campanhaCodigo, 'sobreviventes', sid), { habilidades: habs });
      aplicadas++;
    }

    overlay.remove();
    if (aplicadas > 0) {
      toast(`${aplicadas} Cicatriz(es) aplicada(s).`, 'sucesso');
    } else {
      toast('Nenhuma seleção feita.', 'info');
    }
  };
};

};

window.adicionarCaminho = async () => {
  const nomeInput = document.getElementById('susp-caminho-nome');
  const descInput = document.getElementById('susp-caminho-desc');
  const nome = nomeInput.value.trim();
  const desc = descInput.value.trim();
  if (!nome) { toast('Dê um nome pro caminho.', 'erro'); return; }
  const s = getSuspense();
  s.caminhos.push({ id: 'c_' + Date.now().toString(36), nome, desc });
  await salvarSuspense(s);
  nomeInput.value = ''; descInput.value = '';
  toast(`Caminho "${nome}" adicionado.`, 'sucesso');
};

window.removerCaminho = async (id) => {
  if (!confirm('Remover esse caminho? Passos e armadilhas dele também saem.')) return;
  const s = getSuspense();
  s.caminhos = s.caminhos.filter(c => c.id !== id);
  s.passos = s.passos.filter(p => p.caminhoId !== id);
  s.armadilhas = s.armadilhas.filter(a => a.caminhoId !== id);
  await salvarSuspense(s);
};

window.adicionarPasso = async () => {
  const nomeInput = document.getElementById('susp-passo-nome');
  const descInput = document.getElementById('susp-passo-desc');
  const caminhoSel = document.getElementById('susp-passo-caminho');
  const nome = nomeInput.value.trim();
  const desc = descInput.value.trim();
  const caminhoId = caminhoSel.value;
  if (!nome) { toast('Dê um nome pro passo.', 'erro'); return; }
  if (!caminhoId) { toast('Escolha um caminho.', 'erro'); return; }
  const s = getSuspense();
  s.passos.push({ id: 'p_' + Date.now().toString(36), nome, desc, caminhoId, encontrado: false });
  await salvarSuspense(s);
  nomeInput.value = ''; descInput.value = '';
  toast(`Passo "${nome}" adicionado.`, 'sucesso');
};

window.removerPasso = async (id) => {
  const s = getSuspense();
  s.passos = s.passos.filter(p => p.id !== id);
  await salvarSuspense(s);
};

window.adicionarArmadilha = async () => {
  const nomeInput = document.getElementById('susp-armadilha-nome');
  const descInput = document.getElementById('susp-armadilha-desc');
  const caminhoSel = document.getElementById('susp-armadilha-caminho');
  const nome = nomeInput.value.trim();
  const desc = descInput.value.trim();
  const caminhoId = caminhoSel.value;
  if (!nome) { toast('Dê um nome pra armadilha.', 'erro'); return; }
  if (!caminhoId) { toast('Escolha um caminho.', 'erro'); return; }
  const s = getSuspense();
  s.armadilhas.push({ id: 'a_' + Date.now().toString(36), nome, desc, caminhoId, ativada: false });
  await salvarSuspense(s);
  nomeInput.value = ''; descInput.value = '';
  toast(`Armadilha "${nome}" adicionada.`, 'sucesso');
};

window.removerArmadilha = async (id) => {
  const s = getSuspense();
  s.armadilhas = s.armadilhas.filter(a => a.id !== id);
  await salvarSuspense(s);
};

window.marcarPassoEncontrado = async (id) => {
  const s = getSuspense();
  s.passos = s.passos.map(p => p.id === id ? { ...p, encontrado: !p.encontrado } : p);
  await salvarSuspense(s);
};

window.marcarArmadilhaAtivada = async (id) => {
  const s = getSuspense();
  s.armadilhas = s.armadilhas.map(a => a.id === id ? { ...a, ativada: !a.ativada } : a);
  await salvarSuspense(s);
};

window.resetarSuspense = async () => {
  if (!confirm('Resetar a cena inteira? Caminhos, passos e armadilhas serão apagados.')) return;
  await salvarSuspense({ ...SUSPENSE_PADRAO });
  toast('Cena de Suspense resetada.', 'info');
};

function renderSuspenseCard() {
  const s = getSuspense();
  const totalPassos = s.passos.length;
  const passosEncontrados = s.passos.filter(p => p.encontrado).length;
  const opcoesCaminhos = s.caminhos.map(c => `<option value="${c.id}">${window.escapeHtml(c.nome)}</option>`).join('');

  return `
    <div class="suspense-card">
      <div class="suspense-titulo">🕯️ Cena de Suspense ${s.ativa ? '· <span style="color:var(--sick)">ATIVA</span>' : '· <span style="color:var(--bone-dim)">em rascunho</span>'}</div>

      <div class="suspense-resolucao">
        <div class="tit">🎯 Resolução</div>
        <div class="field" style="margin:6px 0 4px 0;">
          <input id="susp-res-titulo" value="${window.escapeHtml(s.resolucao.titulo || '')}" placeholder="ex: realizar o ritual pra enfraquecer a criatura" onchange="setSuspenseResolucao('titulo', this.value)">
        </div>
        <div class="field" style="margin:0;">
          <input id="susp-res-desc" value="${window.escapeHtml(s.resolucao.desc || '')}" placeholder="detalhes do objetivo da cena" onchange="setSuspenseResolucao('desc', this.value)">
        </div>
      </div>

      ${totalPassos > 0 ? `
        <div class="suspense-progresso">
          <span>Progresso dos Passos:</span>
          <b>${passosEncontrados} / ${totalPassos}</b>
          <span>${passosEncontrados === totalPassos ? '✓ RESOLUÇÃO PRONTA' : ''}</span>
        </div>
      ` : ''}

      <div style="margin-bottom:14px;">
        <div style="font-family:'Anton',sans-serif; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--bone-dim); margin-bottom:8px;">🛤️ Caminhos (${s.caminhos.length})</div>
        ${s.caminhos.length === 0
          ? '<p class="meta">Nenhum caminho criado ainda.</p>'
          : s.caminhos.map(c => {
              const passosDoCaminho = s.passos.filter(p => p.caminhoId === c.id);
              const armadilhasDoCaminho = s.armadilhas.filter(a => a.caminhoId === c.id);
              return `
                <div class="suspense-caminho">
                  <div class="nome">
                    ${window.escapeHtml(c.nome)}
                    <button class="btn ghost small" style="margin-left:auto;" onclick="removerCaminho('${c.id}')">×</button>
                  </div>
                  ${c.desc ? `<div class="desc">${window.escapeHtml(c.desc)}</div>` : ''}
                  ${passosDoCaminho.length || armadilhasDoCaminho.length ? `
                    <div class="chips">
                      ${passosDoCaminho.map(p => `<span class="chip-passo ${p.encontrado ? 'encontrado' : ''}" onclick="marcarPassoEncontrado('${p.id}')" style="cursor:pointer;" title="Clique pra marcar/desmarcar">✦ ${window.escapeHtml(p.nome)}</span>`).join('')}
                      ${armadilhasDoCaminho.map(a => `<span class="chip-armadilha ${a.ativada ? 'ativada' : ''}" onclick="marcarArmadilhaAtivada('${a.id}')" style="cursor:pointer;" title="Clique pra marcar/desmarcar">⚔ ${window.escapeHtml(a.nome)}</span>`).join('')}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
      </div>

      <details class="regra-grupo" style="margin-top:16px;">
        <summary style="padding:10px 14px; font-size:12px;">
          <span><span class="summary-icon" style="font-size:14px;">＋</span>Adicionar Caminho / Passo / Armadilha</span>
        </summary>
        <div style="padding:14px;">
          <div class="suspense-add-grid">
            <div class="field">
              <label>Nome do Caminho</label>
              <input id="susp-caminho-nome" placeholder="ex: Porta dos fundos">
            </div>
            <div class="field">
              <label>Descrição</label>
              <input id="susp-caminho-desc" placeholder="o que tem lá">
            </div>
            <div class="field" style="justify-content:flex-end;">
              <button class="btn ghost small" onclick="adicionarCaminho()" ${s.caminhos.length >= 6 ? 'disabled' : ''}>+ Caminho</button>
            </div>
          </div>

          ${s.caminhos.length > 0 ? `
            <div class="suspense-add-grid" style="margin-top:14px;">
              <div class="field">
                <label>Passo (Revelação)</label>
                <input id="susp-passo-nome" placeholder="ex: encontrar o amuleto">
              </div>
              <div class="field">
                <label>Descrição</label>
                <input id="susp-passo-desc" placeholder="detalhe do achado">
              </div>
              <div class="field">
                <label>Caminho</label>
                <select id="susp-passo-caminho">${opcoesCaminhos}</select>
              </div>
              <div class="field" style="justify-content:flex-end; grid-column: 1 / -1;">
                <button class="btn ghost small" onclick="adicionarPasso()">+ Passo</button>
              </div>
            </div>

            <div class="suspense-add-grid" style="margin-top:14px;">
              <div class="field">
                <label>Armadilha</label>
                <input id="susp-armadilha-nome" placeholder="ex: telha solta">
              </div>
              <div class="field">
                <label>Descrição</label>
                <input id="susp-armadilha-desc" placeholder="efeito ao ativar">
              </div>
              <div class="field">
                <label>Caminho</label>
                <select id="susp-armadilha-caminho">${opcoesCaminhos}</select>
              </div>
              <div class="field" style="justify-content:flex-end; grid-column: 1 / -1;">
                <button class="btn ghost small" onclick="adicionarArmadilha()">+ Armadilha</button>
              </div>
            </div>
          ` : ''}
        </div>
      </details>

      <div class="assassino-saved-acoes" style="margin-top:20px;">
        ${!s.ativa
          ? `<button class="btn-montar-assassino" style="background:linear-gradient(135deg,#1e3a5f,var(--sky));border-color:var(--sky);" onclick="ativarSuspense()">🕯️ Ativar Cena</button>`
          : `<button class="btn-reabrir-assassino" onclick="desativarSuspense()">⏹ Encerrar Cena</button>`
        }
        <button class="btn ghost small" onclick="resetarSuspense()">↻ Resetar</button>
      </div>
    </div>
  `;
}

    window.avancarIniciativa = async () => {
      const atual = campanhaEstado.info?.iniciativa || { indice: 0 };
      const arquetipos = new Set((campanhaEstado.sobreviventes || []).map(s => s.arquetipo));
      const ordem = INICIATIVA_ORDEM.filter(a => a === 'Assassino' || arquetipos.has(a));
      const total = Math.max(ordem.length, 1);
      const novoIndice = (atual.indice + 1) % total;
      await window.fsUpdateDoc(window.fsDoc(window.db, 'campanhas', campanhaCodigo), { iniciativa: { indice: novoIndice } });
    };
  </script>
</body>
